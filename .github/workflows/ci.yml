name: LocalPDF CI & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'  # weekly scheduled scan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-security:
    name: Audit & Security Scans
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

      - name: Lint (ESLint with security plugin)
        run: npx eslint . --ext .js,.ts,.tsx --no-ignore

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit tests (Vitest)
        run: npm test --if-present

      # --- CodeQL analysis ---
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: CodeQL Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL queries
        uses: github/codeql-action/analyze@v3
        with:
          category: "security"

      # --- Snyk open source scan ---
      - name: Snyk Scan
        uses: snyk/actions@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: "--severity-threshold=high"

      # --- Trivy image scan (optional) ---
      - name: Trivy Scan (container image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vercel/og-image:latest
          severity: HIGH,CRITICAL
          format: table
        continue-on-error: true

      # --- OWASP ZAP baseline scan ---
      - name: Start Vercel preview for ZAP
        run: |
          npm run build && npx serve -s out -l 3000 &
          echo "SERVER_PID=$!" > server.pid
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          docker_name: "owasp/zap2docker-stable"
        env:
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
        continue-on-error: true

      - name: Stop preview server
        if: always()
        run: |
          if test -f server.pid; then kill $(cat server.pid) || true; fi

      - name: Upload SARIF reports
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  build-verification:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: audit-and-security
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js production bundle
        run: npm run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-verification
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy (Vercel)
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: "--prod --confirm"
          working-directory: .