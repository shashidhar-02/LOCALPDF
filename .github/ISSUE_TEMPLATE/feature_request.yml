name: 💡 Feature Request
description: Propose a new feature, improvement, or PDF tool idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please remember that LocalPDF is strictly client-side/in-browser only. Features requiring server-side compute or AI upload processing do not fit our privacy architecture.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what problem you are trying to solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what tool or capability you would like added to LocalPDF.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, references, or mockups.
