name: 🐛 Bug Report
description: File a bug report to help us improve LocalPDF
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! LocalPDF processes files entirely in your browser. **Never upload sensitive PDF documents.**
  - type: dropdown
    id: tool
    attributes:
      label: Affected Tool
      options:
        - General / Viewer
        - JPG/PNG to PDF (/jpg-to-pdf)
        - Merge PDF (/merge-pdf)
        - Split PDF (/split-pdf)
        - Extract Pages (/extract-pdf-pages)
        - Rotate PDF (/rotate-pdf)
        - Page Organizer (/pdf-page-organizer)
        - Compress PDF (/compress-pdf)
        - Sign PDF (/sign-pdf)
        - Annotate PDF (/annotate-pdf)
        - Fill PDF (/fill-pdf)
        - PDF Metadata (/pdf-metadata)
        - Protect PDF (/protect-pdf)
        - PDF to Text / OCR (/pdf-to-text, /pdf-ocr)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Open tool ...
        2. Upload a sample PDF with ...
        3. Click on ...
        4. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser & OS
      description: E.g., Chrome 122 on Windows 11, Safari on iOS 17.
    validations:
      required: true
